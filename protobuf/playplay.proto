syntax = "proto3";

import "nanopb.proto";

message PlayPlayLicenseRequest {
  option (nanopb_msgopt).type = FT_CALLBACK;
  int32 version = 1;
  bytes token = 2;
  optional bytes cache_id = 3;
  Interactivity interactivity = 4;
  ContentType content_type = 5;
  int64 timestamp = 6;
}

enum Interactivity {
  UNKNOWN_INTERACTIVITY = 0;
  INTERACTIVE = 1;
  DOWNLOAD = 2;
}

enum ContentType {
  UNKNOWN_CONTENT_TYPE = 0;
  AUDIO_TRACK = 1;
  AUDIO_EPISODE = 2;
  AUDIO_ADD = 3;
}

message PlayPlayLicenseResponse {
  option (nanopb_msgopt).type = FT_CALLBACK;
  bytes obfuscated_key = 1;
  bytes b4_seq = 2;
}
